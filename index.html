<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WafidFill Dashboard Bridge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .loading {
            margin-top: 50px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #dc3545;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .success {
            background: #28a745;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 WafidFill Dashboard</h1>
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading dashboard...</p>
        </div>
    </div>

    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const passport = urlParams.get('passport');
        
        async function sendStopCommand() {
            if (action === 'stop' && passport) {
                // Send command via chrome.storage
                await chrome.storage.local.set({ 
                    stopRefillCommand: { 
                        passportNumber: passport, 
                        timestamp: Date.now() 
                    } 
                });
                console.log(`✅ Stop command sent for ${passport}`);
                
                // Also update Convex
                const CONVEX_URL = 'https://artful-kingfisher-32.convex.site/api';
                const extensionId = await getExtensionId();
                
                await fetch(CONVEX_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'stopIndividualRefill',
                        extensionId: extensionId,
                        passportNumber: passport,
                    })
                });
                
                showMessage(`✅ Stopped refills for ${passport}`, 'success');
                setTimeout(() => window.close(), 2000);
            } else if (action === 'stopAll') {
                await chrome.storage.local.set({ 
                    stopAllRefillsCommand: { timestamp: Date.now() } 
                });
                console.log(`✅ Stop all command sent`);
                
                const CONVEX_URL = 'https://artful-kingfisher-32.convex.site/api';
                const extensionId = await getExtensionId();
                
                await fetch(CONVEX_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'stopAllRefills',
                        extensionId: extensionId,
                    })
                });
                
                showMessage(`✅ Stopped all refills`, 'success');
                setTimeout(() => window.close(), 2000);
            } else {
                // Just load the dashboard
                window.location.href = 'https://maap3254.github.io/wafidfill-dashboard/';
            }
        }
        
        async function getExtensionId() {
            try {
                const result = await chrome.storage.sync.get(['EXTENSION_ID']);
                return result.EXTENSION_ID || 'unknown';
            } catch (e) {
                return 'unknown';
            }
        }
        
        function showMessage(message, type) {
            const container = document.querySelector('.container');
            const msgDiv = document.createElement('div');
            msgDiv.className = type;
            msgDiv.innerHTML = message;
            container.appendChild(msgDiv);
            document.querySelector('.loading').style.display = 'none';
        }
        
        sendStopCommand();
    </script>
</body>
</html>
