<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WafidFill Active Refills Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .refresh-bar {
            text-align: right;
            margin-bottom: 20px;
        }
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-card .label { color: #666; margin-top: 5px; }
        .table-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            overflow-x: auto;
        }
        .table-card h3 { margin-bottom: 15px; color: #333; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
        .status-active { color: #28a745; font-weight: bold; }
        .status-retry { color: #ff9800; font-weight: bold; }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            width: 100px;
        }
        .progress-fill {
            background: #667eea;
            height: 6px;
            border-radius: 3px;
        }
        .loading { text-align: center; padding: 50px; color: white; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; display: none; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 WafidFill Active Refills</h1>
            <p>Live monitoring of automatic passport refills</p>
        </div>

        <div class="refresh-bar">
            <span id="lastUpdated" style="color: white; margin-right: 15px;"></span>
            <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh Data</button>
        </div>

        <div id="errorMsg" class="error"></div>
        <div id="loadingMsg" class="loading">Loading active refills...</div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="table-card">
            <h3>⏰ Active Refill Timers <span id="activeCount" style="background: #28a745; color: white; padding: 2px 8px; border-radius: 12px; margin-left: 10px;">0</span></h3>
            <div style="overflow-x: auto;">
                <table id="refillsTable">
                    <thead>
                        <tr><th>Passport</th><th>Username</th><th>Progress</th><th>Next Refill</th><th>Next Country</th><th>Status</th><th>Medical Center</th><th>Rate</th></tr>
                    </thead>
                    <tbody id="refillsBody">
                        <tr><td colspan="8" style="text-align: center;">No active refills</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="table-card">
            <h3>📋 Recent Refill History</h3>
            <div style="overflow-x: auto;">
                <table id="historyTable">
                    <thead><tr><th>Time</th><th>Passport</th><th>Username</th><th>Refill #</th><th>Next Country</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============= CONFIGURATION =============
        // YOUR GOOGLE APPS SCRIPT URL (SAME as in extension)
        const API_URL = 'https://script.google.com/macros/s/AKfycbxXyqNuYBf2yTH304gVVjCs6D2kmh5ozWSdGb2NckrjCeV4KaHb9rhztGwWJLFPlgcU/exec';
        
        let autoRefreshInterval;
        
        async function fetchActiveRefills() {
            try {
                const response = await fetch(`${API_URL}?action=getActiveRefills&t=${Date.now()}`);
                const data = await response.json();
                
                if (data.success) {
                    return data.refills || [];
                }
                throw new Error(data.error || 'Failed to fetch');
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }
        
        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_URL}?action=getDashboardData&t=${Date.now()}`);
                const data = await response.json();
                return data.success ? data : null;
            } catch (error) {
                return null;
            }
        }
        
        function updateStats(refills, dashboardData) {
            const statsGrid = document.getElementById('statsGrid');
            const activeCount = refills.length;
            const totalRefills = dashboardData?.stats?.totalRefills || 0;
            const activeUsers = dashboardData?.stats?.activeUsers || 0;
            
            statsGrid.innerHTML = `
                <div class="stat-card"><div class="value">${activeCount}</div><div class="label">Active Refills</div></div>
                <div class="stat-card"><div class="value">${totalRefills}</div><div class="label">Total Refills</div></div>
                <div class="stat-card"><div class="value">${activeUsers}</div><div class="label">Active Users (7d)</div></div>
            `;
        }
        
        function formatTime(seconds) {
            if (!seconds || seconds <= 0) return 'Ready now';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${secs}s`;
            return `${secs}s`;
        }
        
        function updateRefillsTable(refills) {
            const tbody = document.getElementById('refillsBody');
            const countSpan = document.getElementById('activeCount');
            
            countSpan.textContent = refills.length;
            
            if (refills.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">✅ No active refills. Timers start when payment is detected.</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            refills.forEach(refill => {
                const row = tbody.insertRow();
                const progress = (refill.refillCount / refill.totalRefills) * 100;
                
                row.insertCell(0).innerHTML = `<strong>${escapeHtml(refill.passport)}</strong>`;
                row.insertCell(1).innerHTML = escapeHtml(refill.username || 'Unknown');
                row.insertCell(2).innerHTML = `
                    ${refill.refillCount}/${refill.totalRefills}
                    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                `;
                row.insertCell(3).innerHTML = `<span style="${refill.remainingSeconds < 60 ? 'color: #dc3545; font-weight: bold;' : ''}">${formatTime(refill.remainingSeconds)}</span>`;
                row.insertCell(4).innerHTML = `<span style="color: #28a745; font-weight: bold;">${escapeHtml(refill.nextCountry)}</span>`;
                row.insertCell(5).innerHTML = `<span class="${refill.status === 'RETRY' ? 'status-retry' : 'status-active'}">${refill.status === 'RETRY' ? '🔄 Retrying' : '✅ Active'}</span>`;
                row.insertCell(6).innerHTML = escapeHtml(refill.medicalCenter ? refill.medicalCenter.substring(0, 30) : '-');
                row.insertCell(7).innerHTML = escapeHtml(refill.rate || '-');
            });
        }
        
        async function updateHistory() {
            try {
                const response = await fetch(`${API_URL}?action=getRecentActivity&limit=20&t=${Date.now()}`);
                const data = await response.json();
                
                if (data.success && data.activities) {
                    const tbody = document.getElementById('historyBody');
                    tbody.innerHTML = '';
                    
                    data.activities.slice(0, 15).forEach(activity => {
                        const row = tbody.insertRow();
                        row.insertCell(0).innerHTML = new Date(activity.timestamp).toLocaleString();
                        row.insertCell(1).innerHTML = `<strong>${escapeHtml(activity.passportNumber)}</strong>`;
                        row.insertCell(2).innerHTML = escapeHtml(activity.username || 'Unknown');
                        row.insertCell(3).innerHTML = activity.refillNumber > 0 ? `Refill #${activity.refillNumber}` : 'Original';
                        row.insertCell(4).innerHTML = activity.country || '-';
                    });
                }
            } catch(e) {}
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function refreshAll() {
            const loadingDiv = document.getElementById('loadingMsg');
            const errorDiv = document.getElementById('errorMsg');
            
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            
            try {
                const [refills, dashboardData] = await Promise.all([
                    fetchActiveRefills(),
                    fetchDashboardData()
                ]);
                
                updateStats(refills, dashboardData);
                updateRefillsTable(refills);
                await updateHistory();
                
                document.getElementById('lastUpdated').innerHTML = `Last updated: ${new Date().toLocaleTimeString()}`;
                loadingDiv.style.display = 'none';
                
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `⚠️ Error: ${error.message}. Make sure your Apps Script is deployed.`;
            }
        }
        
        // Auto-refresh every 30 seconds
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(refreshAll, 30000);
        }
        
        // Initial load
        refreshAll();
        startAutoRefresh();
    </script>
</body>
</html>
